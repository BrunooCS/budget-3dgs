<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="g-red"><stop offset="0" stop-color="#e0533d" stop-opacity="0.95"/><stop offset="1" stop-color="#e0533d" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-teal"><stop offset="0" stop-color="#1f9e8f" stop-opacity="0.9"/><stop offset="1" stop-color="#1f9e8f" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-gold"><stop offset="0" stop-color="#e3a72f" stop-opacity="0.95"/><stop offset="1" stop-color="#e3a72f" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-blue"><stop offset="0" stop-color="#164be6" stop-opacity="0.85"/><stop offset="1" stop-color="#164be6" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-violet"><stop offset="0" stop-color="#9443d0" stop-opacity="0.8"/><stop offset="1" stop-color="#9443d0" stop-opacity="0"/></radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#626b7a"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="329" rx="14" fill="#ffffff" stroke="#dfe3ea"/>

  <!-- 1. Scene as Gaussians -->
  <text x="28" y="40" font-size="15" font-weight="600" fill="#191b21">1 · The scene is a cloud of 3D Gaussians</text>
  <g transform="translate(40,60)">
    <path d="M30,150 L30,40 L200,10 L230,120 Z" fill="#f6f7f9" stroke="#dfe3ea"/>
    <path d="M30,150 L230,120 M30,150 L95,190 L230,120" fill="none" stroke="#dfe3ea"/>
    <ellipse cx="85" cy="95" rx="48" ry="16" transform="rotate(-25 85 95)" fill="url(#g-teal)"/>
    <ellipse cx="150" cy="70" rx="30" ry="22" transform="rotate(15 150 70)" fill="url(#g-gold)"/>
    <ellipse cx="170" cy="125" rx="52" ry="12" transform="rotate(8 170 125)" fill="url(#g-red)"/>
    <ellipse cx="110" cy="140" rx="22" ry="22" fill="url(#g-violet)"/>
    <ellipse cx="200" cy="60" rx="14" ry="34" transform="rotate(-10 200 60)" fill="url(#g-blue)"/>
    <ellipse cx="60" cy="55" rx="16" ry="9" fill="url(#g-gold)"/>
  </g>
  <text x="28" y="272" font-size="12" fill="#626b7a">Each Gaussian stores</text>
  <text x="28" y="290" font-size="12" fill="#191b21">position · shape (scale + rotation)</text>
  <text x="28" y="308" font-size="12" fill="#191b21">opacity · view-dependent color (SH)</text>

  <line x1="290" y1="160" x2="318" y2="160" stroke="#626b7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Projection -->
  <text x="330" y="40" font-size="15" font-weight="600" fill="#191b21">2 · Project into the camera</text>
  <g transform="translate(330,62)">
    <rect x="0" y="0" width="240" height="170" rx="6" fill="#f6f7f9" stroke="#9ba6b7"/>
    <ellipse cx="70" cy="90" rx="58" ry="20" transform="rotate(-22 70 90)" fill="url(#g-teal)"/>
    <ellipse cx="140" cy="62" rx="36" ry="27" transform="rotate(15 140 62)" fill="url(#g-gold)"/>
    <ellipse cx="160" cy="122" rx="62" ry="14" transform="rotate(6 160 122)" fill="url(#g-red)"/>
    <ellipse cx="95" cy="138" rx="26" ry="26" fill="url(#g-violet)"/>
    <ellipse cx="205" cy="55" rx="16" ry="38" transform="rotate(-8 205 55)" fill="url(#g-blue)"/>
    <line x1="0" y1="105" x2="240" y2="105" stroke="#191b21" stroke-width="0.8" stroke-dasharray="3 3"/>
    <rect x="113" y="100" width="10" height="10" fill="none" stroke="#191b21" stroke-width="1.6"/>
    <text x="128" y="99" font-size="11" fill="#191b21">pixel p</text>
  </g>
  <text x="330" y="272" font-size="12" fill="#626b7a">Every 3D Gaussian becomes a 2D splat;</text>
  <text x="330" y="290" font-size="12" fill="#626b7a">splats are sorted by depth, tile by tile,</text>
  <text x="330" y="308" font-size="12" fill="#626b7a">entirely on the GPU.</text>

  <line x1="586" y1="160" x2="614" y2="160" stroke="#626b7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Alpha blending -->
  <text x="626" y="40" font-size="15" font-weight="600" fill="#191b21">3 · Blend along each pixel ray</text>
  <g transform="translate(626,62)">
    <line x1="0" y1="50" x2="250" y2="50" stroke="#191b21" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="-4" y="44" width="12" height="12" fill="#ffffff" stroke="#191b21" stroke-width="1.6"/>
    <text x="226" y="40" font-size="11" fill="#626b7a">depth</text>
    <ellipse cx="70" cy="50" rx="16" ry="34" fill="url(#g-teal)"/>
    <ellipse cx="135" cy="50" rx="12" ry="28" fill="url(#g-red)"/>
    <ellipse cx="195" cy="50" rx="14" ry="30" fill="url(#g-gold)"/>
    <text x="70" y="102" font-size="12" text-anchor="middle" fill="#191b21">1</text>
    <text x="135" y="102" font-size="12" text-anchor="middle" fill="#191b21">2</text>
    <text x="195" y="102" font-size="12" text-anchor="middle" fill="#191b21">3</text>
    <!-- contribution bars w_i -->
    <line x1="40" y1="170" x2="230" y2="170" stroke="#dfe3ea"/>
    <rect x="58" y="122" width="24" height="48" rx="3" fill="#1f9e8f"/>
    <rect x="123" y="146" width="24" height="24" rx="3" fill="#e0533d"/>
    <rect x="183" y="160" width="24" height="10" rx="3" fill="#e3a72f"/>
    <text x="0" y="150" font-size="12" fill="#191b21" font-style="italic">wᵢ</text>
  </g>
  <text x="626" y="272" font-size="12" fill="#191b21">color(p) = Σᵢ wᵢ · cᵢ</text>
  <text x="626" y="290" font-size="12" fill="#191b21">wᵢ = αᵢ · ∏<tspan baseline-shift="sub" font-size="9">j &lt; i</tspan> (1 − αⱼ)</text>
  <text x="626" y="308" font-size="12" fill="#626b7a">wᵢ: how much Gaussian i shows in pixel p</text>
</svg>
